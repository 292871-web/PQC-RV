# ISA Configuration — generated by RISC-V ISA Explorer
# https://github.com/riscv/riscv-isa-explorer
#
# Deliberately reproducible: the same selection produces a byte-identical
# file. There is no generation timestamp, because two exports of one
# configuration differing on a date defeats diffing and version control.
#
# source:
#   dependencies and parameters — riscv-unified-db 71ad457a48c4
#   instruction encodings      — riscv/riscv-opcodes
#   extension catalogue        — 211 entries


vendor: ""   
device: "PQC-RV"

base_isa: RV32I   # Base ISA only (e.g. RV64I, RV32E)
isa_string: RV32IMC_Zbb_Zca_Zicsr_Zmmul   # Full ISA descriptor (base + all selected extensions)
xlen: 32

# Compiler -march flag. Toolchain compatibility varies by extension family:
#   Scalar crypto (Zk, Zkn, Zks, Zbkb, etc.): supported since ~GCC 12-13 / LLVM 14-15.
#   Vector crypto (the Zvk* family, plus Zvbb and Zvbc): requires GCC 14+ / non-experimental LLVM 18+.
#   Zve/Zvl sub-profile tokens: exact min version unconfirmed — verify with your toolchain:
#     gcc: riscv64-unknown-elf-gcc -march=help
#     clang: clang --target=riscv64-unknown-elf --print-supported-extensions
#   Non-ISA extensions excluded from this string.
march: rv32imc_zbb_zca_zicsr_zmmul

# INFERRED, not chosen. Derived from which extensions are present
# (Zicsr/Zifencei → User Spec 2.3+; supervisor extensions → Priv Spec 1.11+).
# The rule is coarse. Set these yourself if the exact version matters.
user_spec_version: "2.3"        # inferred
privilege_spec_version: "1.10"   # inferred

# Implementation parameters the selection constrains, from
# riscv-unified-db. -march can express only VLEN, and only obliquely
# through the Zvl*b extensions, so these are the part of the
# configuration a compiler flag cannot carry.
#
#   greaterThanOrEqual — a floor; the largest wins
#   includes           — the value must offer at least these
#   oneOf              — pick one; each extension narrows the field
#   equal              — fixed
parameters: {}   # nothing in this selection constrains one

extensions:
  - RV32I
  - M
  - C
  - Zbb
  - Zca
  - Zicsr
  - Zmmul

